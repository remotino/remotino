[package]
name = "remotino-pg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
remotino-crypto = { version = "0.1.0", path = "../remotino-crypto" }
tokio-postgres = "0.7.12"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "macros"] }
thiserror = "2.0.19"
ciborium = "0.2.2"
getrandom = "0.4.3"
hex = "0.4.3"
zeroize = "1.9.0"

# TLS with trust-on-first-use certificate pinning. `ring` (not the default aws-lc-rs) so it
# builds with just the MSVC toolchain - the same reason the app pins russh to ring.
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-postgres-rustls = { version = "0.13.0", default-features = false }
x509-parser = "0.16.0"
sha2 = "0.10.9"

[lints]
workspace = true
